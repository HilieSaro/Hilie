<style>
  /* Galerie d'images chargées */

  .loader {

  .loader-text { text-align: center; font-size: 0.9rem; color: #333; }
  .photo-card {

    max-width: 220px;

    box-shadow: 0 2px 6px rgba(0,0,0,0.06);

    padding: 8px;

    text-align: center;
  }
  .photo-card img { border-radius: 6px; display:block; margin: 0 auto; }
  .photo-title { margin-top: 6px; font-weight: 600; color: #222; font-size: 0.95rem; }

  /* Centrage de la fenêtre caméra */
  #videoWrapper {
    display: flex;
    justify-content: center;
    align-items: center;

  #videoContainer {

    align-items: center;
    gap: 10px;
    width: 100%;
  }

  #v {
  width: 60%;
  max-width: 1200px;
  height: auto;
  aspect-ratio: 16 / 9;
  border-radius: 6px;
  display: block;
  margin: 12px auto;
  background: #000;
  box-shadow: 0 6px 18px rgba(0,0,0,0.25);
}

  #cameraControls {
    display: flex;
    gap: 8px;
    justify-content: center;
    align-items: center;
    width: 100%;
    flex-wrap: wrap;
  }

  #cameraControls button {
    padding: 8px 14px;
    font-size: 1rem;
    border-radius: 6px;
    cursor: pointer;
  }

  /* Miniatures et téléchargements */
  #captures {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 10px;
  }
  .capture-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    background: #fff;
    padding: 6px;
    border-radius: 6px;
    border: 1px solid #ddd;
  }
  .capture-item img, .capture-item video {
    max-width: 160px;
    border-radius: 6px;
    display:block;
  }

  @media (max-width: 480px) {
    #v { max-width: 320px; }
    #videoWrapper { padding: 8px; }
  }
</style>

<script>
window.addEventListener("load", init, false);

let currentStream = null;
let mediaRecorder = null;
let recordedChunks = [];

function init() {
  const btnPhotos = document.getElementById("myButton");
  if (btnPhotos) btnPhotos.addEventListener("click", loadPhotos, false);

  const startBtn = document.getElementById("startCam");
  const stopBtn = document.getElementById("stopCam");
  const photoBtn = document.getElementById("takePhoto");
  const startRecBtn = document.getElementById("startRec");
  const stopRecBtn = document.getElementById("stopRec");

  if (startBtn) startBtn.addEventListener("click", startCamera, false);
  if (stopBtn) stopBtn.addEventListener("click", stopCamera, false);
  if (photoBtn) photoBtn.addEventListener("click", takePhoto, false);
  if (startRecBtn) startRecBtn.addEventListener("click", startRecording, false);
  if (stopRecBtn) stopRecBtn.addEventListener("click", stopRecording, false);
}

/* --- Chargement des photos (galerie existante) --- */
function loadPhotos() {
  const gallery = document.getElementById("content");
  const loader = document.getElementById("loader");
  const loaderText = document.getElementById("loaderText");
  gallery.innerHTML = "";
  const total = 5;
  let pending = total;
  loader.classList.add("show");
  loaderText.textContent = `Chargement de ${total} image(s)...`;
  for (let i = 1; i <= total; i++) {
    const num = String(i).padStart(2, "0");
    const filename = `TOF/${num}Hilie.jpg`;

    const xhr = new XMLHttpRequest();
    xhr.open("GET", filename, true);
    xhr.responseType = "blob";

    xhr.onload = function () {
      if (xhr.status === 200) {
        const blob = xhr.response;
        const card = document.createElement("div");
        card.className = "photo-card";

        const img = document.createElement("img");
        img.src = URL.createObjectURL(blob);
        img.alt = filename;
        img.style.maxWidth = "100%";

        const title = document.createElement("div");
        title.className = "photo-title";
        title.textContent = "Hilie";

        card.appendChild(img);
        card.appendChild(title);
        gallery.appendChild(card);
      } else {
        const err = document.createElement("div");
        err.textContent = `Erreur chargement ${filename}: ${xhr.status}`;
        gallery.appendChild(err);
      }
      pending--;
      if (pending <= 0) {
        loader.classList.remove("show");
        loaderText.textContent = "Chargement terminé";
      } else {
        loaderText.textContent = `Chargement... (${total - pending}/${total})`;
      }
    };

    xhr.onerror = function () {
      const err = document.createElement("div");
      err.textContent = `Erreur réseau pour ${filename}`;
      gallery.appendChild(err);
      pending--;
      if (pending <= 0) {
        loader.classList.remove("show");
        loaderText.textContent = "Chargement terminé";
      } else {
        loaderText.textContent = `Chargement... (${total - pending}/${total})`;
      }
    };

    xhr.send();
  }
}

/* --- Caméra : démarrage / arrêt --- */
async function startCamera() {
  const video = document.getElementById("v");
  const startBtn = document.getElementById("startCam");
  const stopBtn = document.getElementById("stopCam");
  const photoBtn = document.getElementById("takePhoto");
  const startRecBtn = document.getElementById("startRec");

  if (currentStream) return;

  const constraints = { video: { facingMode: "user" }, audio: true };

  try {
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      currentStream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = currentStream;
    } else {
      const getUserMedia = navigator.getUserMedia || navigator.webkitGetUserMedia || navigator.mozGetUserMedia || navigator.msGetUserMedia;
      if (!getUserMedia) throw new Error("getUserMedia non supporté");
      getUserMedia.call(navigator, constraints,
        function(stream) {
          currentStream = stream;
          const url = window.URL || window.webkitURL;
          video.src = url ? url.createObjectURL(stream) : stream;
        },
        function(err) {
          console.error("Erreur getUserMedia fallback", err);
          alert("Impossible d'accéder à la caméra.");
        }
      );
    }

    await video.play().catch(()=>{});
    video.style.display = "block";
    startBtn.disabled = true;
    stopBtn.disabled = false;
    photoBtn.disabled = false;
    startRecBtn.disabled = false;
  } catch (err) {
    console.error("Erreur accès caméra:", err);
    alert("Accès à la caméra refusé ou indisponible.");
  }
}

function stopCamera() {
  const video = document.getElementById("v");
  const startBtn = document.getElementById("startCam");
  const stopBtn = document.getElementById("stopCam");
  const photoBtn = document.getElementById("takePhoto");
  const startRecBtn = document.getElementById("startRec");
  const stopRecBtn = document.getElementById("stopRec");

  if (mediaRecorder && mediaRecorder.state === "recording") {
    // arrête l'enregistrement avant d'arrêter la caméra
    stopRecording();
  }

  if (currentStream) {
    currentStream.getTracks().forEach(track => track.stop());
    currentStream = null;
  }
  try { video.srcObject = null; } catch(e){ video.src = ""; }
  video.style.display = "none";
  startBtn.disabled = false;
  stopBtn.disabled = true;
  photoBtn.disabled = true;
  startRecBtn.disabled = true;
  stopRecBtn.disabled = true;
}

/* --- Capture photo --- */
function takePhoto() {
  const video = document.getElementById("v");
  if (!currentStream) {
    alert("Démarrez la caméra d'abord.");
    return;
  }

  const canvas = document.createElement("canvas");
  canvas.width = video.videoWidth || 640;
  canvas.height = video.videoHeight || 480;
  const ctx = canvas.getContext("2d");
  // miroir pour caméra frontale
  ctx.save();
  ctx.scale(-1, 1);
  ctx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
  ctx.restore();

  canvas.toBlob(function(blob) {
    const url = URL.createObjectURL(blob);
    addCapturePhoto(url, blob);
  }, "image/jpeg", 0.92);
}

function addCapturePhoto(url, blob) {
  const captures = document.getElementById("captures");
  const item = document.createElement("div");
  item.className = "capture-item";

  const img = document.createElement("img");
  img.src = url;
  img.alt = "Photo capturée";

  const dl = document.createElement("a");
  dl.href = url;
  dl.download = `photo_${Date.now()}.jpg`;
  dl.textContent = "Télécharger la photo";
  dl.style.textDecoration = "none";
  dl.style.color = "#0066cc";

  item.appendChild(img);
  item.appendChild(dl);
  captures.prepend(item);
}

/* --- Enregistrement vidéo --- */
function startRecording() {
  if (!currentStream) {
    alert("Démarrez la caméra d'abord.");
    return;
  }
  recordedChunks = [];
  const options = { mimeType: "video/webm;codecs=vp9,opus" };
  try {
    mediaRecorder = new MediaRecorder(currentStream, options);
  } catch (e) {
    // fallback si codec non supporté
    mediaRecorder = new MediaRecorder(currentStream);
  }

  mediaRecorder.ondataavailable = function(e) {
    if (e.data && e.data.size > 0) recordedChunks.push(e.data);
  };

  mediaRecorder.onstop = function() {
    const blob = new Blob(recordedChunks, { type: "video/webm" });
    const url = URL.createObjectURL(blob);
    addCaptureVideo(url, blob);
  };

  mediaRecorder.start();
  document.getElementById("startRec").disabled = true;
  document.getElementById("stopRec").disabled = false;
  document.getElementById("startCam").disabled = true;
  document.getElementById("stopCam").disabled = true;
}

function stopRecording() {
  if (!mediaRecorder) return;
  if (mediaRecorder.state === "recording") {
    mediaRecorder.stop();
  }
  document.getElementById("startRec").disabled = false;
  document.getElementById("stopRec").disabled = true;
  document.getElementById("startCam").disabled = true;
  document.getElementById("stopCam").disabled = false;
}

function addCaptureVideo(url, blob) {
  const captures = document.getElementById("captures");
  const item = document.createElement("div");
  item.className = "capture-item";

  const vid = document.createElement("video");
  vid.src = url;
  vid.controls = true;
  vid.loop = false;

  const dl = document.createElement("a");
  dl.href = url;
  dl.download = `video_${Date.now()}.webm`;
  dl.textContent = "Télécharger la vidéo";
  dl.style.textDecoration = "none";
  dl.style.color = "#0066cc";

  item.appendChild(vid);
  item.appendChild(dl);
  captures.prepend(item);
}

</script>
